spring:
  application:
    name: career-matcher-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careermatcher}
    username: ${DB_USERNAME:careermatcher}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Slightly above app.cv.max-file-size so the API can return its own FILE_TOO_LARGE error.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${SERVER_PORT:8080}
  # Set to "native" only when running behind a trusted reverse proxy that sets X-Forwarded-*.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        dependencies:
          include: db,aiService,storage
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

app:
  # "production" enables startup checks that refuse unsafe settings (see ProductionGuard).
  environment: ${APP_ENV:dev}
  # Production rehearsal on *.localhost only; never set in a real deployment.
  allow-local-origins: ${ALLOW_LOCAL_ORIGINS:false}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:career-matcher}
      audience: ${JWT_AUDIENCE:career-matcher-api}
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:14d}
      cookie-name: cm_refresh
      cookie-path: /api/v1/auth
      # Must be true whenever the site is served over HTTPS (all non-local deployments).
      cookie-secure: ${COOKIE_SECURE:true}
      cookie-same-site: Strict
      reuse-grace: 10s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:20}
      period: 1m
    login-per-email: { capacity: 10, period: 15m }
    register-per-ip:
      capacity: ${RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:10}
      period: 1h
    refresh-per-ip: { capacity: 60, period: 1m }
    sensitive-account-action-per-user: { capacity: 5, period: 15m }
    gap-report-per-user:
      capacity: ${RATE_LIMIT_GAP_REPORTS_PER_HOUR:20}
      period: 1h
    roadmap-per-user:
      capacity: ${RATE_LIMIT_ROADMAPS_PER_HOUR:10}
      period: 1h
    match-explanation-per-user:
      capacity: ${RATE_LIMIT_EXPLANATIONS_PER_HOUR:30}
      period: 1h
    cv-upload-per-user:
      capacity: ${RATE_LIMIT_CV_UPLOADS_PER_HOUR:10}
      period: 1h
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:career-matcher-cvs}
    # Base64 32-byte key; CV files are AES-256-GCM encrypted before they reach storage.
    encryption-key: ${CV_ENCRYPTION_KEY:}
  admin:
    # Creates the first ADMIN account on startup if it does not exist (see AdminBootstrap).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  matching:
    # Component weights of the match score; must sum to 1.0 (validated at startup).
    weights:
      skills: ${MATCH_WEIGHT_SKILLS:0.45}
      experience: ${MATCH_WEIGHT_EXPERIENCE:0.20}
      projects: ${MATCH_WEIGHT_PROJECTS:0.15}
      education: ${MATCH_WEIGHT_EDUCATION:0.10}
      preferences: ${MATCH_WEIGHT_PREFERENCES:0.10}
  jobs:
    # Loads the bundled DEMO job listings (fictional; example.com links). Keep false in production.
    demo-data-enabled: ${JOBS_DEMO_DATA_ENABLED:false}
  cv:
    max-file-size: 5MB
    max-documents-per-user: 20
    max-concurrent-analyses: ${CV_MAX_CONCURRENT_ANALYSES:4}
    stale-after: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout: 2s
    read-timeout: 3s
    analysis-timeout: ${AI_ANALYSIS_TIMEOUT:180s}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    com.careermatcher: ${APP_LOG_LEVEL:INFO}

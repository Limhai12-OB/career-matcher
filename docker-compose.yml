name: career-matcher

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible object storage for CV files (never published to the host).
  storage:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-career-matcher-cvs}
    volumes:
      - cv-storage:/data
      - ./infra/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
    networks: [data]
    healthcheck:
      # Anonymous requests are rejected with 403 once the S3 gateway is serving.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ | grep -q 403"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set in .env}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_DOCS_ENABLED: ${AI_DOCS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
    # Dev convenience only; loopback-bound. The production override removes this.
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-dev}
      ALLOW_LOCAL_ORIGINS: ${ALLOW_LOCAL_ORIGINS:-false}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      RATE_LIMIT_REGISTER_PER_IP_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:-10}
      RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:-20}
      RATE_LIMIT_CV_UPLOADS_PER_HOUR: ${RATE_LIMIT_CV_UPLOADS_PER_HOUR:-10}
      RATE_LIMIT_EXPLANATIONS_PER_HOUR: ${RATE_LIMIT_EXPLANATIONS_PER_HOUR:-30}
      RATE_LIMIT_GAP_REPORTS_PER_HOUR: ${RATE_LIMIT_GAP_REPORTS_PER_HOUR:-20}
      RATE_LIMIT_ROADMAPS_PER_HOUR: ${RATE_LIMIT_ROADMAPS_PER_HOUR:-10}
      MATCH_WEIGHT_SKILLS: ${MATCH_WEIGHT_SKILLS:-0.45}
      MATCH_WEIGHT_EXPERIENCE: ${MATCH_WEIGHT_EXPERIENCE:-0.20}
      MATCH_WEIGHT_PROJECTS: ${MATCH_WEIGHT_PROJECTS:-0.15}
      MATCH_WEIGHT_EDUCATION: ${MATCH_WEIGHT_EDUCATION:-0.10}
      MATCH_WEIGHT_PREFERENCES: ${MATCH_WEIGHT_PREFERENCES:-0.10}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-career-matcher-cvs}
      CV_ENCRYPTION_KEY: ${CV_ENCRYPTION_KEY:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JOBS_DEMO_DATA_ENABLED: ${JOBS_DEMO_DATA_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks: [data, internal, public]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks: [public]

networks:
  # Data stores: backend <-> postgres and object storage.
  data:
  # Service-to-service traffic: backend <-> ai-service only.
  internal:
  # Frontend <-> backend.
  public:

volumes:
  postgres-data:
  cv-storage:
